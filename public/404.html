<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const path = window.location.pathname.replace(/^\/ct-taeSimulator/, '');
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      const target = '/ct-taeSimulator/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash;
      sessionStorage.redirect = target;
      window.location.replace('/ct-taeSimulator/');
    </script>
  </head>
  <body>Redirecting…</body>
</html>
